server {
    listen 80;
    listen [::]:80;
    server_name jpn.manabi.cc;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://jpn.manabi.cc$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jpn.manabi.cc;

    ssl_certificate /etc/letsencrypt/live/jpn.manabi.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jpn.manabi.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /opt/nhg-manabi/web/current;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Prefer built frontend assets and fall back to API-served exam media.
    location /assets/ {
        try_files $uri @api_assets;
    }

    location @api_assets {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name stu.biblenotes.cc;
    ssl_certificate /etc/letsencrypt/live/stu.biblenotes.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stu.biblenotes.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / { return 301 https://jpn.manabi.cc$request_uri; }
}

server {
    listen 80;
    listen [::]:80;
    server_name stu.manabi.cc;
    location / { return 301 https://jpn.manabi.cc$request_uri; }
}
